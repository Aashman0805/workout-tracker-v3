<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1C1A17">
<title>Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Geist:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ─────────────────────────────────────────────────── */
:root {
  --bg:   #F5F2EB;
  --bg2:  #EDEAE0;
  --bg3:  #E2DDD1;
  --ink:  #1C1A17;
  --ink2: #5C594F;
  --ink3: #9C9890;
  --ink4: #C0BBB0;
  --rule: #D4CFC4;
  --acc:  #C9543A;
  --acc2: #A8432C;
  --fd: "Syne", sans-serif;
  --fb: "Geist", sans-serif;
  --fn: "Barlow Condensed", "Arial Narrow", sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

/* ── RESET ──────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; overflow: hidden; }
body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: var(--fb);
  color: var(--ink);
  font-size: 14px;
  /* Notebook rule texture */
  background-image: repeating-linear-gradient(
    180deg,
    transparent,
    transparent 27px,
    rgba(28,26,23,0.038) 27px,
    rgba(28,26,23,0.038) 28px
  );
}

/* ── APP SHELL ──────────────────────────────────────────────── */
.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 430px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
}

/* ── SCREENS ────────────────────────────────────────────────── */
.screen {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.screen.active {
  display: flex;
  opacity: 1;
  transform: none;
}

/* ── TOPBAR ─────────────────────────────────────────────────── */
.topbar {
  background: var(--ink);
  padding: calc(var(--safe-top) + 14px) 22px 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.topbar-logo {
  font-family: var(--fd);
  font-size: 15px;
  font-weight: 700;
  color: var(--bg);
  letter-spacing: 0.01em;
}
.topbar-right {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #4A4844;
}

/* ── SESSION HEADER ─────────────────────────────────────────── */
.sess-hdr {
  background: var(--ink);
  padding: calc(var(--safe-top) + 12px) 20px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.sess-back {
  font-size: 20px;
  color: #4A4844;
  line-height: 1;
  cursor: pointer;
  padding: 2px 4px 2px 0;
}
.sess-hdr-info { flex: 1; }
.sess-hdr-title {
  font-family: var(--fd);
  font-size: 15px;
  font-weight: 700;
  color: var(--bg);
  letter-spacing: -0.1px;
}
.sess-hdr-sub {
  font-size: 9px;
  color: #4A4844;
  margin-top: 1px;
  letter-spacing: 0.02em;
}
.sess-hdr-pct {
  font-family: var(--fn);
  font-size: 18px;
  font-weight: 900;
  color: var(--acc);
  line-height: 1;
}

/* Progress bar */
.prog-track { height: 2px; background: #2A2824; flex-shrink: 0; }
.prog-fill { height: 100%; background: var(--acc); transition: width 0.5s ease; }

/* ── SCROLLABLE CONTENT ─────────────────────────────────────── */
.scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.scroll::-webkit-scrollbar { display: none; }

/* ── NAV ────────────────────────────────────────────────────── */
.nav {
  background: var(--bg2);
  border-top: 0.5px solid var(--rule);
  display: flex;
  padding-bottom: var(--safe-bot);
  flex-shrink: 0;
}
.nb {
  flex: 1;
  padding: 10px 4px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.nb:active { opacity: 0.6; }
.nd {
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--acc);
  transition: opacity 0.15s;
}
.nd.off { opacity: 0; }
.nl {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink4);
  transition: color 0.15s;
}
.nl.on { color: var(--ink); }

/* ── TYPE HELPERS ───────────────────────────────────────────── */
.eyebrow {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink4);
}
.lbl {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink4);
}
.lbl-acc { color: var(--acc); }

/* ── HOME SCREEN ────────────────────────────────────────────── */
.home-body { padding: 22px 22px 0; }
.home-session-name {
  font-family: var(--fd);
  font-size: 46px;
  font-weight: 800;
  letter-spacing: -1.5px;
  line-height: 0.88;
  color: var(--ink);
  margin-bottom: 18px;
  margin-top: 8px;
}
.reason-block {
  background: var(--bg2);
  border-left: 2.5px solid var(--acc);
  padding: 11px 14px;
  margin-bottom: 20px;
}
.reason-text {
  font-size: 12px;
  color: var(--ink2);
  line-height: 1.65;
  margin-top: 4px;
}
.time-row {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
}
.tbtn {
  flex: 1;
  padding: 10px 2px;
  text-align: center;
  font-family: var(--fb);
  font-size: 11px;
  font-weight: 500;
  color: var(--ink4);
  border: 0.5px solid var(--rule);
  border-radius: 2px;
  background: transparent;
  cursor: pointer;
  transition: all 0.12s;
}
.tbtn.sel {
  background: var(--acc);
  color: #fff;
  border-color: var(--acc);
  font-weight: 700;
}
.tbtn:active:not(.sel) { background: var(--bg2); }
.start-btn {
  background: var(--ink);
  border-radius: 2px;
  padding: 15px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  cursor: pointer;
  transition: opacity 0.1s;
}
.start-btn:active { opacity: 0.85; }
.start-btn-label {
  font-family: var(--fd);
  font-size: 15px;
  font-weight: 700;
  color: var(--bg);
}
.start-btn-time {
  font-family: var(--fn);
  font-size: 24px;
  font-weight: 900;
  color: var(--acc);
  line-height: 1;
}
.log-act-btn {
  border: 0.5px solid var(--rule);
  border-radius: 2px;
  padding: 12px;
  text-align: center;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink3);
  cursor: pointer;
  margin-bottom: 22px;
  background: transparent;
  width: 100%;
  display: block;
}
.log-act-btn:active { background: var(--bg2); }

/* ── STATS TRAY ─────────────────────────────────────────────── */
.tray {
  background: var(--bg2);
  border-top: 0.5px solid var(--rule);
  padding: 14px 22px 12px;
  flex-shrink: 0;
}
.stats-row {
  display: flex;
  gap: 22px;
  margin-bottom: 12px;
}
.stat-n {
  font-family: var(--fn);
  font-size: 28px;
  font-weight: 900;
  color: var(--ink);
  line-height: 1;
}
.stat-l {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink4);
  margin-top: 2px;
}
.bars-wrap { display: flex; gap: 2px; align-items: flex-end; }
.bbar { flex: 1; border-radius: 1px; transition: height 0.3s ease; }

/* ── SESSION SCREEN ─────────────────────────────────────────── */
.ex-header {
  padding: 16px 20px 12px;
  border-bottom: 0.5px solid var(--rule);
}
.ex-index {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink4);
  margin-bottom: 6px;
}
.ex-name {
  font-family: var(--fd);
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.4px;
  line-height: 1.05;
  color: var(--ink);
  margin-bottom: 3px;
}
.ex-meta {
  font-size: 10px;
  color: var(--ink3);
}

/* Target block */
.target-block {
  margin: 14px 20px;
  background: var(--ink);
  border-radius: 2px;
  padding: 14px 16px;
}
.target-lbl {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: #4A4844;
  margin-bottom: 6px;
}
.target-row { display: flex; align-items: baseline; gap: 6px; }
.target-num {
  font-family: var(--fn);
  font-size: 56px;
  font-weight: 900;
  color: var(--acc);
  letter-spacing: -2px;
  line-height: 1;
}
.target-unit {
  font-family: var(--fn);
  font-size: 20px;
  font-weight: 600;
  color: #4A4844;
  line-height: 1;
}
.target-delta {
  margin-left: auto;
  font-size: 9px;
  color: #4A4844;
  text-align: right;
  line-height: 1.5;
}
.target-delta.up { color: var(--acc); }

/* Coach block */
.coach-block {
  margin: 0 20px 0;
  background: var(--bg2);
  border-left: 2.5px solid var(--acc);
  padding: 10px 13px;
}
.coach-lbl {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink4);
  margin-bottom: 4px;
}
.coach-txt {
  font-size: 11px;
  color: var(--ink2);
  line-height: 1.65;
}

/* Form cue */
.cue-txt {
  padding: 9px 20px;
  font-size: 10px;
  color: var(--ink3);
  font-style: italic;
  line-height: 1.6;
  border-top: 0.5px solid var(--rule);
}

/* Set rows */
.sets-area { padding: 4px 20px 0; }
.set-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 0;
  border-bottom: 0.5px solid var(--rule);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
}
.set-row.active { color: var(--acc); }
.set-row.pend { color: var(--ink4); font-weight: 500; }

/* Input area */
.inp-area {
  margin: 10px 20px;
  background: var(--bg2);
  border-radius: 2px;
  padding: 12px 13px;
}
.inp-lbl {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink4);
  margin-bottom: 8px;
  display: block;
}
.inp-row {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 8px;
}
.adj {
  width: 38px; height: 38px;
  flex-shrink: 0;
  border-radius: 2px;
  border: 0.5px solid var(--rule);
  background: var(--bg);
  font-size: 20px;
  font-weight: 300;
  color: var(--ink3);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.1s;
  font-family: var(--fb);
}
.adj:active { border-color: var(--acc); color: var(--acc); }
.num-input {
  width: calc(100% - 86px);
  height: 38px;
  border-radius: 2px;
  border: 0.5px solid var(--rule);
  background: var(--bg);
  font-family: var(--fn);
  font-size: 22px;
  font-weight: 800;
  text-align: center;
  color: var(--ink);
  outline: none;
  -moz-appearance: textfield;
}
.num-input::-webkit-inner-spin-button,
.num-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.num-input:focus { border-color: var(--acc); }
.log-set-btn {
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  background: var(--acc);
  color: #fff;
  border-radius: 2px;
  font-family: var(--fd);
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  border: none;
  cursor: pointer;
  transition: opacity 0.1s, transform 0.1s;
}
.log-set-btn:active { opacity: 0.85; transform: scale(0.98); }

/* Completion note */
.comp-note {
  padding: 9px 20px 12px;
  font-size: 11px;
  color: var(--ink3);
  line-height: 1.6;
  border-top: 0.5px solid var(--rule);
}
.comp-note.up { color: var(--acc); }

/* Phase buttons */
.phase-btn {
  display: block;
  width: calc(100% - 40px);
  margin: 14px 20px;
  padding: 14px;
  background: var(--ink);
  color: var(--bg);
  border-radius: 2px;
  font-family: var(--fd);
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  border: none;
  cursor: pointer;
  transition: opacity 0.1s;
}
.phase-btn:active { opacity: 0.85; }
.phase-btn.acc { background: var(--acc); }

/* ── REST TIMER ─────────────────────────────────────────────── */
.timer-wrap {
  margin: 10px 20px;
  background: var(--bg2);
  border-radius: 2px;
  padding: 14px;
  text-align: center;
  transition: background 0.3s;
}
.timer-wrap.done { background: var(--bg3); border: 0.5px solid var(--rule); }
.timer-lbl { margin-bottom: 10px; }
.timer-ring { position: relative; width: 64px; height: 64px; margin: 0 auto 10px; }
.timer-num {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--fn);
  font-size: 18px;
  font-weight: 900;
  color: var(--ink);
}
.timer-num.done { color: var(--acc); font-size: 14px; }
.timer-btns { display: flex; gap: 8px; justify-content: center; }
.timer-btn {
  padding: 7px 16px;
  border-radius: 2px;
  font-size: 11px;
  font-weight: 600;
  border: 0.5px solid var(--rule);
  background: var(--bg);
  color: var(--ink3);
  cursor: pointer;
  font-family: var(--fb);
}
.timer-btn.acc { background: var(--acc); color: #fff; border-color: var(--acc); }

/* ── AGILITY PHASE ──────────────────────────────────────────── */
.phase-header {
  padding: 16px 20px 12px;
  border-bottom: 0.5px solid var(--rule);
}
.phase-title {
  font-family: var(--fd);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.3px;
  color: var(--ink);
  margin-top: 5px;
  margin-bottom: 3px;
}
.phase-sub { font-size: 10px; color: var(--ink3); }
.drill-item {
  padding: 13px 20px;
  border-bottom: 0.5px solid var(--rule);
}
.drill-name {
  font-family: var(--fd);
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 2px;
  letter-spacing: -0.1px;
}
.drill-protocol { font-size: 10px; color: var(--acc); font-weight: 600; margin-bottom: 5px; }
.drill-cue { font-size: 11px; color: var(--ink2); line-height: 1.6; }
.drill-prog { font-size: 10px; color: var(--ink3); font-style: italic; margin-top: 4px; }

/* ── ENDURANCE PHASE ────────────────────────────────────────── */
.end-block {
  margin: 14px 20px;
  background: var(--bg2);
  border-left: 2.5px solid var(--ink);
  padding: 13px 14px;
}
.end-phase { font-size: 8px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink4); margin-bottom: 5px; }
.end-title { font-family: var(--fd); font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
.end-desc { font-size: 11px; color: var(--ink2); line-height: 1.7; }

/* ── ANCHOR PHASE ───────────────────────────────────────────── */
.anchor-item { padding: 14px 20px; border-bottom: 0.5px solid var(--rule); }
.anchor-name { font-family: var(--fd); font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
.anchor-desc { font-size: 11px; color: var(--ink2); line-height: 1.65; }

/* ── CHALLENGE SCREEN ───────────────────────────────────────── */
.chal-body { padding: 22px 22px 0; }
.chal-label { font-size: 9px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--acc); margin-bottom: 10px; }
.chal-name {
  font-family: var(--fd);
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -1.2px;
  line-height: 0.9;
  color: var(--ink);
  margin-bottom: 16px;
}
.chal-rule { height: 1.5px; background: var(--ink); margin-bottom: 16px; }
.chal-desc { font-size: 13px; color: var(--ink); line-height: 1.8; margin-bottom: 16px; }
.chal-meta {
  background: var(--bg2);
  border-radius: 2px;
  padding: 12px 14px;
  display: flex;
  justify-content: space-between;
  margin-bottom: 16px;
}
.chal-meta-item {}
.chal-meta-lbl { font-size: 8px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink4); margin-bottom: 3px; }
.chal-meta-val { font-size: 13px; font-weight: 600; color: var(--ink); }
.chal-meta-val.prev { color: var(--ink3); }
.chal-context { padding: 12px 0; border-top: 0.5px solid var(--rule); font-size: 10px; color: var(--ink4); line-height: 1.65; }

/* ── LOG SCREEN ─────────────────────────────────────────────── */
.log-body { padding: 20px 22px 0; }
.log-section-title { font-family: var(--fd); font-size: 22px; font-weight: 800; letter-spacing: -0.3px; color: var(--ink); margin-bottom: 4px; margin-top: 6px; }
.log-section-sub { font-size: 10px; color: var(--ink3); margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-label { font-size: 8px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink4); margin-bottom: 7px; display: block; }
.form-select {
  width: 100%;
  background: var(--bg2);
  border: 0.5px solid var(--rule);
  border-radius: 2px;
  padding: 11px 13px;
  color: var(--ink);
  font-size: 13px;
  font-weight: 500;
  font-family: var(--fb);
  -webkit-appearance: none;
  appearance: none;
}
.form-select:focus { outline: none; border-color: var(--acc); }
.form-num {
  width: 100%;
  background: var(--bg2);
  border: 0.5px solid var(--rule);
  border-radius: 2px;
  padding: 11px 13px;
  color: var(--ink);
  font-family: var(--fn);
  font-size: 26px;
  font-weight: 900;
  text-align: center;
  outline: none;
  -moz-appearance: textfield;
}
.form-num::-webkit-inner-spin-button,
.form-num::-webkit-outer-spin-button { -webkit-appearance: none; }
.form-num:focus { border-color: var(--acc); }
.int-row { display: flex; gap: 5px; }
.int-btn {
  flex: 1;
  padding: 10px 4px;
  text-align: center;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink4);
  border: 0.5px solid var(--rule);
  border-radius: 2px;
  background: transparent;
  cursor: pointer;
  font-family: var(--fb);
}
.int-btn.sel { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.save-btn {
  display: block;
  width: 100%;
  padding: 14px;
  background: var(--acc);
  color: #fff;
  border-radius: 2px;
  font-family: var(--fd);
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  border: none;
  cursor: pointer;
  margin-bottom: 22px;
  transition: opacity 0.1s;
}
.save-btn:active { opacity: 0.85; }
.recent-item {
  padding: 11px 0;
  border-bottom: 0.5px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.recent-name { font-size: 13px; font-weight: 600; color: var(--ink); }
.recent-meta { font-size: 10px; color: var(--ink3); margin-top: 1px; }
.recent-date { font-size: 10px; color: var(--ink4); }

/* ── HISTORY SCREEN ─────────────────────────────────────────── */
.hist-body { padding: 20px 22px 0; }
.hist-title { font-family: var(--fd); font-size: 22px; font-weight: 800; letter-spacing: -0.3px; color: var(--ink); margin-bottom: 4px; margin-top: 6px; }
.hist-sub { font-size: 10px; color: var(--ink3); margin-bottom: 20px; }
.cal-month-lbl {
  font-family: var(--fd);
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 8px;
  letter-spacing: -0.1px;
}
.cal-dow-row { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; margin-bottom: 4px; }
.cal-dow { text-align: center; font-size: 8px; font-weight: 600; color: var(--ink4); letter-spacing: 0.06em; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; margin-bottom: 18px; }
.cal-day {
  aspect-ratio: 1;
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 500;
  color: var(--ink4);
}
.cal-day.has-sess { background: rgba(201,84,58,0.12); color: var(--acc); font-weight: 700; }
.cal-day.has-act { background: var(--bg2); color: var(--ink2); font-weight: 600; }
.cal-day.is-today { border: 1px solid var(--ink); color: var(--ink); }
.cal-day.future { opacity: 0.22; }
.hist-item {
  padding: 11px 0;
  border-bottom: 0.5px solid var(--rule);
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.hist-accent-line { width: 2px; height: 100%; background: var(--acc); border-radius: 1px; flex-shrink: 0; align-self: stretch; }
.hist-accent-line.act { background: var(--rule2, #C8C4BA); }
.hist-item-info { flex: 1; }
.hist-item-name { font-size: 13px; font-weight: 600; color: var(--ink); }
.hist-item-meta { font-size: 10px; color: var(--ink3); margin-top: 1px; }
.hist-item-date { font-size: 10px; color: var(--ink4); white-space: nowrap; }

/* ── MODAL ──────────────────────────────────────────────────── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(28,26,23,0.55);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-sheet {
  background: var(--bg);
  width: 100%;
  max-width: 430px;
  border-radius: 12px 12px 0 0;
  border-top: 1px solid var(--ink);
  padding: 20px 22px calc(var(--safe-bot) + 20px);
  max-height: 80vh;
  overflow-y: auto;
}
.modal-title { font-family: var(--fd); font-size: 20px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
.modal-sub { font-size: 10px; color: var(--ink3); margin-bottom: 18px; }
.modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }

/* ── DONE SCREEN ────────────────────────────────────────────── */
.done-body {
  padding: 28px 22px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
.done-rule { height: 1.5px; background: var(--ink); width: 100%; margin-bottom: 22px; }
.done-title { font-family: var(--fd); font-size: 34px; font-weight: 800; letter-spacing: -0.8px; color: var(--ink); margin-bottom: 8px; }
.done-sub { font-size: 12px; color: var(--ink2); line-height: 1.7; margin-bottom: 28px; }

/* ── REENTRY STRIP ──────────────────────────────────────────── */
.reentry-strip {
  padding: 12px 22px;
  border-bottom: 0.5px solid var(--rule);
  border-left: 2.5px solid var(--ink3);
  margin-left: 0;
  background: var(--bg2);
}
.reentry-lbl { font-size: 8px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink4); margin-bottom: 3px; }
.reentry-txt { font-size: 11px; color: var(--ink2); line-height: 1.6; }

/* ── ANIMATIONS ─────────────────────────────────────────────── */
@keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
.fu { animation: fadeUp 0.2s ease both; }
</style>
</head>
<body>
<div class="app">

<!-- ══ HOME ══════════════════════════════════════════════════ -->
<div id="s-home" class="screen active">
  <div class="topbar">
    <span class="topbar-logo">Coach</span>
    <span class="topbar-right" id="h-date"></span>
  </div>
  <div class="scroll">
    <div id="h-reentry"></div>

        <button class="tbtn" onclick="setTime(15,this)">15m</button>
        <button class="tbtn" onclick="setTime(30,this)">30m</button>
        <button class="tbtn sel" onclick="setTime(45,this)">45m</button>

      </div>
      <button class="log-act-btn" onclick="go('log')">+ Log an activity</button>

  </div>
  <div class="tray">
    <div class="stats-row">
      <div><div class="stat-n" id="h-stat-sess">0</div><div class="stat-l">Sessions</div></div>
      <div><div class="stat-n" id="h-stat-acts">0</div><div class="stat-l">Activities</div></div>
      <div><div class="stat-n" id="h-stat-days">0</div><div class="stat-l">Active days</div></div>

  </div>
  <div class="nav">

    <div class="nb" onclick="go('log')"><div class="nd off" id="nd-log"></div><div class="nl" id="nl-log">Log</div></div>
    <div class="nb" onclick="go('history')"><div class="nd off" id="nd-history"></div><div class="nl" id="nl-history">History</div></div>
  </div>
</div>

<!-- ══ SESSION ═══════════════════════════════════════════════ -->
<div id="s-session" class="screen">

</div>

<div id="s-log" class="screen">

    <span class="topbar-right">Activity</span>
  </div>

  <div class="nav">

    <div class="nb" onclick="go('history')"><div class="nd off" id="nd2-history"></div><div class="nl" id="nl2-history">History</div></div>
  </div>
</div>

<!-- ══ HISTORY ════════════════════════════════════════════════ -->

  </div>
</div>

  <div class="modal-sheet" id="modal-body"></div>
</div>

<script>

/* ══ AXIS ENGINE ════════════════════════════════════════════════ */
function axisScore(axis) {
  let load = 0; const now = Date.now();
  S.hist.forEach(h => {
    const hrs = (now - h.ts) / 3600000;
    const decay = Math.max(0, 1 - hrs * (DECAY[axis]||0.02));
    const sl = SESSIONS[h.sType]; if (sl?.axes?.[axis]) load += sl.axes[axis] * decay;
  });
  S.acts.forEach(a => {
    const hrs = (now - a.ts) / 3600000;
    const decay = Math.max(0, 1 - hrs * (DECAY[axis]||0.02));
    const axl = ACTS_MAP[a.type]?.axes?.[axis] || 0;
    const m = a.intensity==="hard"?1.2:a.intensity==="moderate"?0.8:0.5;
    load += axl * m * 10 * decay;
  });
  return Math.min(10, load);
}
function allAxes() { return {push:axisScore("push"),pull:axisScore("pull"),lower:axisScore("lower"),cond:axisScore("cond")}; }

function recommend() {
  const ax = allAxes();
  const sorted = Object.entries(ax).sort((a,b)=>a[1]-b[1]);
  const lowest = sorted[0][0];
  if (ax.cond < 3 && ax.push > 5 && ax.pull > 5 && ax.lower > 5) return "cond";
  const last = S.hist.length ? S.hist[S.hist.length-1].sType : null;
  if (lowest==="push" && last==="push") return "pull";
  if (lowest==="pull" && last==="pull") return "lower";
  if (Object.values(ax).every(v=>v>3&&v<7)) return "full";
  return {push:"push",pull:"pull",lower:"lower",cond:"cond"}[lowest] || "full";
}

function reasonText(type) {
  const ax = allAxes();
  const names = {push:"push",pull:"pull",lower:"lower body",cond:"conditioning"};
  const sorted = Object.entries(ax).sort((a,b)=>a[1]-b[1]);
  const fresh = names[sorted[0][0]];
  const loaded = sorted.filter(e=>e[1]>6).map(e=>names[e[0]]);
  if (loaded.length) return `${loaded.join(" and ")} still loaded. ${fresh} is freshest — time to work it.`;
  if (S.hist.length===0) return "All systems fresh. Start with pull — the most important pattern.";
  return `${fresh} is the freshest system today.`;
}

function shouldChallenge(t) {
  if (S.hist.filter(h=>!h.isChallenge).length < 8) return false;
  const ax = allAxes();
  const fresh = Object.values(ax).every(v=>v<4);
  const weeks = (Date.now() - (S.lastChallenge||0)) / (7*86400000);
  return fresh && weeks >= 2 && t >= 45;
}
function nextChallenge() {
  const used = S.hist.filter(h=>h.isChallenge).map(h=>h.chalId);
  return CHALLENGES.find(c=>!used.includes(c.id)) || CHALLENGES[0];
}

const TABS = ["home","log","history"];
function go(tab) {
  TABS.forEach(t => {
    const s = document.getElementById("s-"+t);
    if (t === tab) {
      s.style.display = "flex";
      requestAnimationFrame(() => s.classList.add("active"));
    } else {
      s.classList.remove("active");
      s.style.display = "none";
    }
  });
  // Update all three nav bars
  [["nd","nl"],["nd2","nl2"],["nd3","nl3"]].forEach(([nd,nl])=>{
    TABS.forEach(t=>{
      const d=document.getElementById(`${nd}-${t}`), l=document.getElementById(`${nl}-${t}`);
      if(!d||!l) return;
      d.classList.toggle("off", t!==tab);
      l.classList.toggle("on", t===tab);
    });
  });
  if (tab==="home")    rHome();
  if (tab==="log")     rLog();
  if (tab==="history") rHistory();
}
function goHome() {
  document.getElementById("s-session").classList.remove("active");
  document.getElementById("s-session").style.display = "none";
  go("home");
}
function closeModal(e) {

function rStats() {
  const now = Date.now(); const w14 = 14*86400000;
  document.getElementById("h-stat-sess").textContent = S.hist.filter(h=>now-h.ts<w14).length;
  document.getElementById("h-stat-acts").textContent = S.acts.filter(a=>now-a.ts<w14).length;

    ...S.hist.filter(h=>now-h.ts<w14).map(h=>ds(h.ts)),
    ...S.acts.filter(a=>now-a.ts<w14).map(a=>ds(a.ts)),
  ]).size;
}

function rBars() {
  const wrap = document.getElementById("h-bars");
  const now = Date.now(); const DAY = 86400000;
  let html = "";
  for (let i=13;i>=0;i--) {
    const d = ds(now - i*DAY);
    const hasW = S.hist.some(h=>ds(h.ts)===d);
    const hasA = S.acts.some(a=>ds(a.ts)===d);
    const isT = i===0;
    const h = hasW ? Math.floor(10+Math.random()*10) : hasA ? 8 : 3;
    const bg = isT && (hasW||hasA) ? "var(--acc)" : hasW ? "var(--ink)" : hasA ? "var(--ink2)" : "var(--rule)";
    html += `<div class="bbar" style="height:${h}px;background:${bg};"></div>`;
  }
  wrap.innerHTML = html;
}

/* ══ SESSION ════════════════════════════════════════════════════ */
function startSession() {
  const t = S.sessTime;
  const isChal = shouldChallenge(t);
  if (isChal) {
    const ch = nextChallenge();
    sess = {type:"challenge", chalId:ch.id, ts:Date.now(), dur:t, exLogs:{}, phase:"challenge"};
  } else {
    const type = recommend();
    const exKey = t<=15?"ex15":t<=30?"ex30":t<=45?"ex45":t<=60?"ex60":"ex75";
    const exIds = SESSIONS[type][exKey] || SESSIONS[type].ex45;
    const agIds = t>=30 ? SESSIONS[type].agility : [];
    const end   = t>=45 ? SESSIONS[type].endurance : null;
    const week  = Math.min(Math.floor(S.hist.length/12)+1,12);
    sess = {type, ts:Date.now(), dur:t, exIds, agIds, end, exLogs:{}, phase:"agility", week};
  }
  clearInterval(tIv); tExId=null;
  TABS.forEach(t => {
    const s = document.getElementById("s-"+t);
    s.classList.remove("active");
    s.style.display = "none";
  });
  const ss = document.getElementById("s-session");
  ss.style.display = "flex";
  requestAnimationFrame(() => ss.classList.add("active"));
  rSess();
}

function rSess() {
  if (!sess) return;
  const sl = sess.type!=="challenge" ? SESSIONS[sess.type] : null;
  document.getElementById("ss-title").textContent = sl ? sl.name : nextChallenge().name;
  document.getElementById("ss-sub").textContent = `${sess.dur} min · ${new Date(sess.ts).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}`;
  rPhase();
}

function getProg() {
  if (!sess || sess.type==="challenge") return 0;
  const total = sess.exIds.length;
  const done = sess.exIds.filter(id=>{
    const ls = (sess.exLogs[id]||{sets:[]}).sets||[];
    return ls.length >= (EX[id]?.sets||0);
  }).length;
  return total ? Math.round(done/total*100) : 0;
}
function updProg() {
  const p = getProg();
  document.getElementById("ss-pct").textContent = p+"%";
  document.getElementById("ss-prog").style.width = p+"%";
}

function rPhase() {
  const body = document.getElementById("ss-body");
  if (!sess) return;

  /* CHALLENGE */
  if (sess.type==="challenge") { rChallenge(body); return; }

  const week = sess.week||1;
  const progIdx = week<=4?0:week<=8?1:2;

  /* AGILITY */
  if (sess.phase==="agility") {
    if (!sess.agIds?.length) { sess.phase="strength"; rPhase(); return; }
    const rounds = sess.dur>=45?3:2;
    const progs = [
      ["Learn the pattern — quality over speed","Max speed — beat your score","Remove predictability — vary the pattern"],
      ["Max distance, controlled landing","Single-leg variation","Eyes closed 10s then open"],
      ["Controlled footwork, learn it","Game speed","Randomise direction"],
      ["Steady pace, rhythm first","Max speed sustained","Single leg — 15s each"],
    ];
    let html = `<div class="phase-header">
      <div class="eyebrow" style="margin-bottom:0;color:var(--acc);">Agility block</div>
      <div class="phase-title">Move first</div>
      <div class="phase-sub">${rounds} round${rounds>1?"s":""} · 90s rest between · Week ${week<=4?"1–4":week<=8?"5–8":"9–12"}</div>
    </div>`;
    sess.agIds.forEach((id,i)=>{
      const ex = EX[id]; if(!ex) return;
      html += `<div class="drill-item">
        <div class="drill-name">${ex.name}</div>
        <div class="drill-protocol">${ex.wl||"30s"}</div>
        <div class="drill-cue">${ex.cue}</div>
        <div class="drill-prog">This block: ${progs[i%progs.length][progIdx]}</div>
      </div>`;
    });
    const next = sess.dur<30?"anchors":"strength";
    html += `<button class="phase-btn" onclick="sess.phase='${next}';rPhase()">Done → ${next==="anchors"?"Anchors":"Strength"}</button>`;
    body.innerHTML = html; updProg(); return;
  }

  /* STRENGTH */
  if (sess.phase==="strength") {
    const totalSets = sess.exIds.reduce((s,id)=>s+(EX[id]?.sets||0),0);
    const doneSets  = sess.exIds.reduce((s,id)=>s+((sess.exLogs[id]?.sets||[]).length),0);
    let html = "";
    sess.exIds.forEach(id=>{
      const ex = EX[id]; if(!ex) return;
      const ls = (sess.exLogs[id]||{sets:[]}).sets||[];
      const isBW=!!ex.bw, allDone=ls.length>=ex.sets, cur=ls.length;
      const sugg=getSugg(ex,id), prev=getPrev(ex,id);
      const coach=ex.coach[Math.min(cur,ex.coach.length-1)];
      let react="";
      if(ls.length){ const last=ls[ls.length-1]; react=last.r>=ex.rr[1]?"Top of range — match it. ":last.r>=ex.rr[0]?`${last.r} reps — push for ${last.r+1}. `:`${last.r} reps — below target. `; }

      html += `<div class="ex-header">
        <div class="ex-index">${String(sess.exIds.indexOf(id)+1).padStart(2,"0")} / ${String(sess.exIds.length).padStart(2,"0")}</div>
        <div class="ex-name">${ex.name}</div>
        <div class="ex-meta">${ex.sets} sets · ${ex.rr[0]}–${ex.rr[1]} reps${!isBW?" · "+ex.wl:""}</div>
      </div>`;

      if (!isBW) {
        const up=prev&&sugg>prev.w, same=prev&&sugg===prev.w;
        const delta = prev ? (up?`↑ ${(sugg-prev.w).toFixed(1)} kg from last session`:(same?`Same — hit all ${ex.rr[1]} reps to unlock next jump`:"Adjusted")) : "Starting weight";
        html += `<div class="target-block">
          <div class="target-lbl">Target this set</div>
          <div class="target-row">
            <div class="target-num">${sugg}</div>
            <div class="target-unit">kg</div>
            <div class="target-delta${up?" up":""}">${delta}</div>
          </div>
        </div>`;
      }

      if (!allDone) html += `<div class="coach-block">
        <div class="coach-lbl">Coach · Set ${cur+1} of ${ex.sets}</div>
        <div class="coach-txt">${react}${coach}</div>
      </div>`;

      html += `<div class="cue-txt">${ex.cue}</div>`;
      html += `<div class="sets-area">`;
      for(let s=0;s<ex.sets;s++){
        const logged=ls.find(l=>l.set===s), prevDone=s===0||ls.find(l=>l.set===s-1);
        if(logged){ const win=logged.r>=ex.rr[1],ok=logged.r>=ex.rr[0]&&!win; html+=`<div class="set-row${win||ok?" done":""}">`+`<span>Set ${s+1}</span><span>${isBW?"":logged.w+"kg · "}${logged.r} reps${win?" ✓":""}</span></div>`; }
        else if(prevDone&&s===ls.length){
          html+=`<div class="inp-area"><span class="inp-lbl">Log set ${s+1}</span>`;
          if(!isBW) html+=`<span class="inp-lbl">Weight (kg)</span><div class="inp-row"><button class="adj" onclick="adj('w${id}${s}',-2.5)">−</button><input class="num-input" type="number" id="w${id}${s}" value="${sugg}" step="0.5" min="0" inputmode="decimal"><button class="adj" onclick="adj('w${id}${s}',2.5)">+</button></div>`;
          html+=`<span class="inp-lbl">Reps</span><div class="inp-row"><button class="adj" onclick="adj('r${id}${s}',-1)">−</button><input class="num-input" type="number" id="r${id}${s}" value="${ex.rr[1]}" step="1" min="0" inputmode="numeric"><button class="adj" onclick="adj('r${id}${s}',1)">+</button></div><button class="log-set-btn" onclick="logSet('${id}',${s},${isBW?1:0},${ex.rest})">Log set ${s+1}</button></div>`;
        } else if(s>ls.length) html+=`<div class="set-row pend"><span>Set ${s+1}</span><span style="font-size:10px;">complete set ${s} first</span></div>`;
      }
      html+=`</div><div id="tmr-${id}"></div>`;
      if(allDone){
        const allWin=ls.slice(0,ex.sets).every(s=>s.r>=ex.rr[1]);
        const msg=allWin&&!isBW&&ex.inc?`Next session: ${sugg+ex.inc} kg — every rep hit.`:allWin?(ex.note||"All sets done."):`Same weight (${sugg} kg). Build the reps.`;
        html+=`<div class="comp-note${allWin&&!isBW&&ex.inc?" up":""}">${msg}</div>`;
      }
    });
    if(doneSets>=totalSets){
      const next=sess.end?"endurance":"anchors";
      html+=`<button class="phase-btn${sess.end?"":" acc"}" onclick="sess.phase='${next}';rPhase()">All sets done → ${sess.end?"Endurance":"Anchors"}</button>`;
    }
    html+=`<div id="g-tmr" style="margin-bottom:20px;"></div>`;
    body.innerHTML=html; updProg();
    if(tExId&&tLeft>0) tickTimer();
    return;
  }

  /* ENDURANCE */
  if(sess.phase==="endurance"){
    const wk=sess.week||1, idx=wk<=4?0:wk<=8?1:2;
    const p=END_PROTOCOLS[sess.end||"bike"][idx];
    body.innerHTML=`<div class="phase-header">
      <div class="eyebrow" style="color:var(--ink3);">Endurance · Week ${wk<=4?"1–4":wk<=8?"5–8":"9–12"} · ${p.phase}</div>
      <div class="phase-title">${p.title}</div>
    </div>
    <div class="end-block">
      <div class="end-phase">Protocol</div>
      <div class="end-desc">${p.desc}</div>
    </div>
    <button class="phase-btn acc" onclick="sess.phase='anchors';rPhase()">Done → Anchors</button>`;
    return;
  }

  /* ANCHORS */
  if(sess.phase==="anchors"){
    body.innerHTML=`<div class="phase-header">
      <div class="eyebrow">Every session</div>
      <div class="phase-title">Anchors</div>
    </div>
    <div class="anchor-item">
      <div class="anchor-name">Dead hang</div>
      <div class="anchor-desc">2 × 30s. Arms fully straight. Let the spine decompress. Do not pull — just hang and breathe.</div>
    </div>
    <div class="anchor-item">
      <div class="anchor-name">Plank</div>
      <div class="anchor-desc">2 × 40s. Body completely rigid. Squeeze glutes, brace core, press the floor away.</div>
    </div>
    <button class="phase-btn acc" onclick="sess.phase='done';rPhase()">Done</button>`;
    return;
  }

  /* DONE */
  if(sess.phase==="done"){
    const msgs={push:"Push day done.",pull:"Pull day done.",lower:"Lower day done.",full:"Full session done.",cond:"Conditioning done."};
    body.innerHTML=`<div class="done-body">
      <div class="done-rule"></div>
      <div class="done-title">Session complete.</div>
      <div class="done-sub">${msgs[sess.type]||"Session done."} Every block. This is what the adaptation is built on — showing up consistently, not perfectly.</div>
      <button class="phase-btn acc" style="width:100%;margin:0;" onclick="finishSess()">Save and go home</button>
    </div>iv>`;
    return;
  }
}

function rChallenge(body){
  const ch=CHALLENGES.find(c=>c.id===sess.chalId)||CHALLENGES[0];
  const prev=S.hist.filter(h=>h.isChallenge&&h.chalId===ch.id).pop();
  if(!sess.chalStarted){
    body.innerHTML=`<div class="chal-body">
      <div class="chal-label">Challenge workout</div>
      <div class="chal-name">${ch.name}</div>
      <div class="chal-rule"></div>
      <div class="chal-desc">${ch.desc}</div>
      <div class="chal-meta">
        <div class="chal-meta-item"><div class="chal-meta-lbl">Target</div><div class="chal-meta-val">${ch.target}</div></div>
        <div class="chal-meta-item" style="text-align:right;"><div class="chal-meta-lbl">Previous</div><div class="chal-meta-val prev">${prev?.chalScore||"—"}</div></div>
      </div>
      <button class="phase-btn acc" onclick="sess.chalStarted=true;sess.chalStart=Date.now();rChallenge(document.getElementById('ss-body'))">Start the clock</button>
      <div class="chal-context">All systems were fresh. ${Math.round((Date.now()-(S.lastChallenge||0))/(7*86400000))} weeks since your last challenge. This replaced today's regular session.</div>
    </div>`;
  } else {
    body.innerHTML=`<div class="chal-body">
      <div class="chal-label">In progress</div>
      <div class="chal-name">${ch.name}</div>
      <div class="chal-rule"></div>
      <div class="chal-desc" style="margin-bottom:20px;">${ch.desc}</div>
      <div class="lbl" style="margin-bottom:8px;">Log your result</div>
      <input id="chal-score" style="width:100%;background:var(--bg2);border:.5px solid var(--rule);border-radius:2px;padding:13px 14px;font-family:var(--fb);font-size:15px;font-weight:600;color:var(--ink);outline:none;margin-bottom:12px;" type="text" placeholder="e.g. 18:42 or 7 minutes">
      <button class="phase-btn acc" style="width:100%;margin:0;" onclick="finishChallenge()">Save result</button>
    </div>`;
  }
}

function finishChallenge(){
  const score=document.getElementById("chal-score")?.value||"—";
  S.hist.push({sType:"full",ts:sess.ts,dur:sess.dur,exLogs:{},isChallenge:true,chalId:sess.chalId,chalScore:score});
  S.lastChallenge=Date.now(); sess=null;
  document.getElementById("s-session").classList.remove("active");
  document.getElementById("s-session").style.display="none";
  save(); go("home");
}

/* ══ PROGRESSION ════════════════════════════════════════════════ */
function getSugg(ex,id){
  if(ex.bw||!ex.inc) return 0;
  const p=getPrev(ex,id); if(!p) return ex.sw||0;
  return p.sets.every(s=>s.r>=ex.rr[1]) ? +(p.w+ex.inc).toFixed(1) : +p.w;
}
function getPrev(ex,id){
  if(!sess) return null;
  const same=S.hist.filter(h=>h.sType===sess.type);
  for(let i=same.length-1;i>=0;i--){ const el=same[i].exLogs?.[id]; if(el?.sets?.length) return {w:el.sets[0]?.w||0,sets:el.sets}; }
  return null;
}
function adj(inputId,delta){
  const el=document.getElementById(inputId); if(!el) return;
  const v=parseFloat(el.value||0)+delta;
  el.value=Math.max(0,Number.isInteger(delta)?Math.round(v):parseFloat(v.toFixed(1)));
}
function logSet(exId,si,isBW,rest){
  const wi=document.getElementById(`w${exId}${si}`), ri=document.getElementById(`r${exId}${si}`);
  if(!ri) return;
  const w=isBW?0:parseFloat(wi?.value||0), r=parseInt(ri.value||0); if(!r) return;
  if(!sess.exLogs[exId]) sess.exLogs[exId]={sets:[]};
  sess.exLogs[exId].sets=sess.exLogs[exId].sets.filter(s=>s.set!==si);
  sess.exLogs[exId].sets.push({set:si,w,r});
  sess.exLogs[exId].sets.sort((a,b)=>a.set-b.set);
  const ex=EX[exId]; if(ex&&si<ex.sets-1) startTimer(exId,rest);
  rPhase();
}
function finishSess(){
  if(!sess) return;
  S.hist.push({sType:sess.type,ts:sess.ts,dur:sess.dur,exLogs:sess.exLogs,isChallenge:false});
  sess=null; clearInterval(tIv); tExId=null;
  document.getElementById("s-session").classList.remove("active");
  document.getElementById("s-session").style.display="none";
  save(); go("home");
}

/* ══ TIMER ══════════════════════════════════════════════════════ */
function startTimer(exId,secs){
  clearInterval(tIv); tExId=exId; tLeft=secs; tTotal=secs;
  tickTimer();
  tIv=setInterval(()=>{ tLeft--; if(tLeft<=0){clearInterval(tIv);tLeft=0;} tickTimer(); },1000);
}
function tickTimer(){
  const el=document.getElementById(`tmr-${tExId}`)||document.getElementById("g-tmr"); if(!el) return;
  const m=Math.floor(tLeft/60),s=tLeft%60,pct=tTotal?(tTotal-tLeft)/tTotal*100:100,done=tLeft===0,R=24;
  el.innerHTML=`<div class="timer-wrap${done?" done":""}">
    <div class="timer-lbl lbl">${done?"Rest done — go":"Rest"}</div>
    <div class="timer-ring">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="${R}" fill="none" stroke="${done?"var(--rule)":"#D4CFC4"}" stroke-width="4"/>
        <circle cx="32" cy="32" r="${R}" fill="none" stroke="${done?"var(--acc)":"var(--ink)"}" stroke-width="4"
          stroke-dasharray="${2*Math.PI*R}" stroke-dashoffset="${2*Math.PI*R*(1-pct/100)}"
          stroke-linecap="round" transform="rotate(-90 32 32)"
          style="transition:stroke-dashoffset 1s linear;"/>
      </svg>
      <div class="timer-num${done?" done":""}">${done?"GO":m+":"+String(s).padStart(2,"0")}</div>
    </div>
    <div class="timer-btns">
      <button class="timer-btn" onclick="startTimer('${tExId}',${tTotal})">Reset</button>
      <button class="timer-btn acc" onclick="clearInterval(tIv);tLeft=0;tickTimer()">Skip</button>
    </div>
  </div>`;
}

/* ══ LOG ════════════════════════════════════════════════════════ */
function setInt(v,btn){
  actInt=v;
  document.querySelectorAll(".int-btn").forEach(b=>b.classList.remove("sel"));
  btn.classList.add("sel");
}
function saveAct(){
  const type=document.getElementById("act-type").value;
  const dur=parseInt(document.getElementById("act-dur").value)||60;
  S.acts.push({type,label:ACTS_MAP[type].label,dur,intensity:actInt,ts:Date.now()});
  save(); rLog(); rStats(); rBars();
  const btn=document.getElementById("log-save-btn");
  btn.textContent="Saved ✓"; btn.style.background="var(--ink)";
  setTimeout(()=>{ btn.textContent="Save"; btn.style.background=""; },1500);
}
function rLog(){
  const el=document.getElementById("log-recent");
  const all=[...S.hist.map(h=>({...h,_t:"sess"})),...S.acts.map(a=>({...a,_t:"act"}))].sort((a,b)=>b.ts-a.ts).slice(0,6);
  if(!all.length){ el.innerHTML=`<div style="font-size:12px;color:var(--ink4);padding:12px 0;">Nothing logged yet.</div>`; return; }
  el.innerHTML=all.map(e=>{
    const name=e._t==="sess"?SESSIONS[e.sType]?.name||"Session":e.label;
    const meta=e._t==="sess"?`${e.dur} min session`:e.dur?`${e.dur} min · ${e.intensity||""}`:e.dur+"min";
    const d=new Date(e.ts).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
    return `<div class="recent-item"><div><div class="recent-name">${name}</div><div class="recent-meta">${meta}</div></div><div class="recent-date">${d}</div></div>`;
  }).join("");
}

/* ══ HISTORY ════════════════════════════════════════════════════ */
function rHistory(){
  const total=S.hist.length+S.acts.length;
  document.getElementById("hist-sub-top").textContent=`${S.hist.length} sessions · ${S.acts.length} activities`;
  rCalendar();
  const listEl=document.getElementById("hist-list");
  const all=[...S.hist.map(h=>({...h,_t:"sess"})),...S.acts.map(a=>({...a,_t:"act"}))].sort((a,b)=>b.ts-a.ts);
  if(!all.length){ listEl.innerHTML=`<div style="font-size:12px;color:var(--ink4);padding:12px 0;">Nothing yet.</div>`; return; }
  listEl.innerHTML=all.map(e=>{
    const name=e._t==="sess"?SESSIONS[e.sType]?.name||"Session":e.label;
    const meta=e._t==="sess"?`${e.dur} min · ${Object.keys(e.exLogs||{}).length} exercises logged`:`${e.dur} min · ${e.intensity||""} effort`;
    const d=new Date(e.ts).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
    return `<div class="hist-item">
      <div class="hist-accent-line${e._t==="act"?" act":""}"></div>
      <div class="hist-item-info">
        <div class="hist-item-name">${name}${e.isChallenge?" · Challenge":""}</div>
        <div class="hist-item-meta">${meta}${e.chalScore?` · ${e.chalScore}`:""}</div>
      </div>
      <div class="hist-item-date">${d}</div>
    </div>`;
  }).join("");
}
function rCalendar(){
  const wrap=document.getElementById("hist-cal");
  const wDs=new Set(S.hist.map(h=>ds(h.ts)));
  const aDs=new Set(S.acts.map(a=>ds(a.ts)));
  const now=new Date(); let html="";
  for(let m=1;m>=0;m--){
    const mo=new Date(now.getFullYear(),now.getMonth()-m,1);
    html+=`<div class="cal-month-lbl">${mo.toLocaleDateString("en-GB",{month:"long",year:"numeric"}).toUpperCase()}</div>`;
    html+=`<div class="cal-dow-row">${["M","T","W","T","F","S","S"].map(d=>`<div class="cal-dow">${d}</div>`).join("")}</div>`;
    html+=`<div class="cal-grid">`;
    let dow=new Date(mo.getFullYear(),mo.getMonth(),1).getDay(); dow=dow===0?6:dow-1;
    for(let i=0;i<dow;i++) html+=`<div></div>`;
    const dim=new Date(mo.getFullYear(),mo.getMonth()+1,0).getDate();
    const tds=ds(Date.now());
    for(let d=1;d<=dim;d++){
      const dstr=`${mo.getFullYear()}-${String(mo.getMonth()+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const hasW=wDs.has(dstr),hasA=aDs.has(dstr),isT=dstr===tds,isFut=dstr>tds;
      html+=`<div class="cal-day${hasW?" has-sess":hasA?" has-act":""}${isT?" is-today":""}${isFut?" future":""}">${d}</div>`;
    }
    html+=`</div>`;
  }
  wrap.innerHTML=html;
}

/* ══ UTILS ══════════════════════════════════════════════════════ */
function ds(ts){ const d=new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }

/* ══ INIT ═══════════════════════════════════════════════════════ */
rHome();
</script>
</div>
